model_name: ver2_13_attn_gruE_odeD_adaptiveTrack
root_dir: /home/onebom/

### data param
dataset:
  type: Cityscapes
  direct:
    enable: true
  dataset_params:
    data_dir: /data/onebom/data/Cityscapes/leftImg8bit_sequence_trainvaltest/leftImg8bit_sequence/
    frame_shape: 64
    num_action_classes: 0

  cond_params:
    cond_type: point_track #["point_track" or "flow"]
    # cond_dir: null
    mode: use_preprocessd #[preprocess_ing, use_preprocessd, null]
    point_track_params:
      track_dim: 3 # [2: only location, 3: with visibility]
      exp_track_dim: 8 #[x,y,v,vt,at,theta_t,rel_x,rel_y]
      feature_dim: 128
      point_grid: 64
      guery_frame_idx: [0] #cond_frames 시작, 끝 [0,3]

  train_params:
    type: train
    cond_frames: 4
    pred_frames: 2
    total_frames: 6
    batch_size: 64
    dataloader_workers: 4

  valid_params:
    type: valid
    cond_frames: 4
    pred_frames: 2
    total_frames: 6
    batch_size: 8
    num_videos: 256
    num_samples: 1
    log_dir: ${train_params.save_dir}/logs_validation/
    wSeg: True

### model param
model:
  dim: 64
  track_dim: ${dataset.cond_params.point_track_params.exp_track_dim}
  vid_dim: 3
  cond_num: ${dataset.train_params.cond_frames}
  pred_num: ${dataset.train_params.pred_frames}
  attn_num: 2
  odeint_rtol: 1e-4
  odeint_atol: 1e-5
  ode_method: "adaptive_heun"
  ode_layers: 2
  ode_hidden_dim: 128

### train param
train_params:
  seed: 0
  save_dir: /data/onebom/result/ongoing/${wandb.project}/${model_name}
  save_ckpt_freq: 1000
  valid_freq: 1000
  num_repeats: 1
  max_epochs: 1000
  max_steps: 300000

  mixed_precision: "no" #["no", "fp16", "bf16"],  
  grad_accumulation_steps: 4

  optimizer:
    type: AdamW
    params:
      eps: 1e-8
      betas: [0.9, 0.999]
      lr: 1e-4
      weight_decay: 1e-2

  lr_scheduler:
    type: cosine
    params:
      lr_warmup_steps: 50000

## logging param
wandb:
  entity: onebom
  enable: true
  project: Trajectory_Prediction
   
checkpoint:
  auto_resume: true
  resume: /data/onebom/result/ongoing/Trajectory_Prediction/ver2_13_attn_gruE_odeD_adaptiveTrack/checkpoints/vdm_steps_16000
  output: ${train_params.save_dir}/checkpoints/